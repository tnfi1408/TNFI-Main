<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .fi-ring-slate { fill: #F3F4EA; }
      .fi-green { fill: #17985B; }
    </style>
  </defs>

  <!-- Left Arc of Circular Ring (Center 100, 100, R=84, r=60) -->
  <path class="fi-ring-slate" 
        d="M 36.5 45 
           A 84 84 0 0 0 36.5 155 
           L 76 155 
           A 60 60 0 0 1 76 45 
           Z" 
        fill="#28323E" />

  <!-- Right Arc of Circular Ring -->
  <path class="fi-ring-slate" 
        d="M 124 45 
           A 60 60 0 0 1 124 155 
           L 163.5 155 
           A 84 84 0 0 0 163.5 45 
           Z" 
        fill="#28323E" />

  <!-- Top Letter 'I' -->
  <path class="fi-ring-slate" 
        d="M 86 24 
           L 114 24 
           L 114 31 
           C 111 31 108 33 107 37 
           L 107 83 
           C 108 87 111 89 114 89 
           L 114 96 
           L 86 96 
           L 86 89 
           C 89 89 92 87 93 83 
           L 93 37 
           C 92 33 89 31 86 31 
           Z" 
        fill="#28323E" />

  <!-- Green 'F' / 'r' Component (#17985B) -->
  <!-- Left Accent Bar -->
  <rect class="fi-green" x="75" y="112" width="13" height="38" fill="#17985B" />

  <!-- Main Vertical Stem with Top Right Arm -->
  <path class="fi-green" 
        d="M 91 102 
           L 142 102 
           L 142 122 
           L 111 122 
           L 111 196 
           L 91 196 
           Z" 
        fill="#17985B" />
</svg>